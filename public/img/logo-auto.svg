<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <style>
    .st0{fill:#343a40;}
    .st1{fill:#dc3545;}
    .text{fill:#343a40;font-family:Arial,sans-serif;font-weight:bold;}
  </style>
  <g>
    <!-- Lingkaran luar -->
    <circle cx="100" cy="100" r="90" fill="#f8f9fa" stroke="#343a40" stroke-width="5"/>
    
    <!-- Ikon kunci pas -->
    <path class="st0" d="M75,60c-8.3,0-15,6.7-15,15c0,6.2,3.8,11.6,9.2,13.9l-5.3,35.4c-0.3,1.9,0.3,3.9,1.6,5.3c1.3,1.4,3.2,2.3,5.2,2.3h8.6c2,0,3.9-0.8,5.2-2.3c1.3-1.4,1.9-3.3,1.6-5.3l-5.3-35.4c5.4-2.3,9.2-7.7,9.2-13.9C90,66.7,83.3,60,75,60z"/>
    
    <!-- Ikon obeng -->
    <rect x="120" y="60" width="10" height="40" class="st0" transform="rotate(15, 125, 80)"/>
    <path class="st0" d="M115,110l5-10l15,3l-5,10z" transform="rotate(15, 125, 80)"/>
    
    <!-- Garis bengkel (crossout) -->
    <path class="st1" d="M60,40l80,120" stroke="#dc3545" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Teks "AUTO" -->
    <text x="100" y="160" class="text" text-anchor="middle" font-size="24">SELF AUTO</text>
  </g>
</svg> 